<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepositions Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="prepositions.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Logo -->
        <div class="logo-container">
            <h1 class="game-logo">📦 Where Is It? 📦</h1>
        </div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>Find the Position!</h1>
                <p class="subtitle">Learn prepositions: in, on, under, beside</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card position-card" id="position-card">
                        <div class="position-display" id="position-display">
                            <div class="visual-display" id="visual-display"></div>
                        </div>
                        <div class="question-text" id="question-text">Where is the cat?</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <!-- Answer pills will be dynamically inserted here -->
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← Back to Menu</a>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        const scenarios = [
            { object: 'cat', emoji: '🐱', container: 'box', containerEmoji: '📦', preposition: 'in', visual: '📦🐱', sentence: 'The cat is IN the box' },
            { object: 'cat', emoji: '🐱', container: 'box', containerEmoji: '📦', preposition: 'on', visual: '🐱\n📦', sentence: 'The cat is ON the box' },
            { object: 'cat', emoji: '🐱', container: 'box', containerEmoji: '📦', preposition: 'under', visual: '📦\n🐱', sentence: 'The cat is UNDER the box' },
            { object: 'cat', emoji: '🐱', container: 'box', containerEmoji: '📦', preposition: 'beside', visual: '📦 🐱', sentence: 'The cat is BESIDE the box' },
            { object: 'apple', emoji: '🍎', container: 'table', containerEmoji: '🪑', preposition: 'on', visual: '🍎\n🪑', sentence: 'The apple is ON the table' },
            { object: 'apple', emoji: '🍎', container: 'table', containerEmoji: '🪑', preposition: 'under', visual: '🪑\n🍎', sentence: 'The apple is UNDER the table' },
            { object: 'ball', emoji: '⚽', container: 'chair', containerEmoji: '🪑', preposition: 'on', visual: '⚽\n🪑', sentence: 'The ball is ON the chair' },
            { object: 'ball', emoji: '⚽', container: 'chair', containerEmoji: '🪑', preposition: 'under', visual: '🪑\n⚽', sentence: 'The ball is UNDER the chair' },
            { object: 'book', emoji: '📚', container: 'desk', containerEmoji: '🪑', preposition: 'on', visual: '📚\n🪑', sentence: 'The book is ON the desk' },
            { object: 'bird', emoji: '🐦', container: 'tree', containerEmoji: '🌳', preposition: 'in', visual: '🌳🐦', sentence: 'The bird is IN the tree' }
        ];

        const prepositions = ['in', 'on', 'under', 'beside'];
        const game = createGameState();
        let currentScenario = null;

        function displayRound() {
            game.clearTimer();
            currentScenario = getRandomItem(scenarios, game.usedItems, s => `${s.object}-${s.preposition}`);

            document.getElementById('visual-display').textContent = currentScenario.visual;
            document.getElementById('question-text').textContent = `Where is the ${currentScenario.object}?`;

            const wrongPreps = prepositions.filter(p => p !== currentScenario.preposition).slice(0, 2);
            const options = shuffleArray([currentScenario.preposition, ...wrongPreps]);

            createAnswerPills(options, o => o, o => o, makeGuess);
            resetRoundState('position-card');
        }

        function makeGuess(selectedPrep) {
            const isCorrect = selectedPrep === currentScenario.preposition;

            markAnswerPills(selectedPrep, currentScenario.preposition);
            showFeedback(isCorrect, currentScenario.sentence, 'position-card');
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
