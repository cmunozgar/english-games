<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't or Doesn't?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="doesnt.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="🙅 Don't or Doesn't? 🙅‍♂️"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>Don't or Doesn't?</h1>
                <p class="subtitle">Learn when to use "don't" and "doesn't"!</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="scene-container">
                        <div class="sentence-card">
                            <div class="subject-emoji" id="subject-emoji">👦</div>
                            <div class="sentence-text">
                                <span class="subject" id="subject">He</span>
                                <span class="blank" id="blank">______</span>
                                <span class="verb" id="verb">eat</span>
                                <span class="object" id="object">chocolate</span>
                                <span class="object-emoji" id="object-emoji">🍫</span>
                            </div>
                        </div>

                        <div class="answer-options" id="answer-options">
                            <!-- Buttons will be generated dynamically -->
                        </div>
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        const subjects = [
            { name: 'He', emoji: '👦', singular: true },
            { name: 'She', emoji: '👧', singular: true },
            { name: 'It', emoji: '🐕', singular: true },
            { name: 'The cat', emoji: '🐱', singular: true },
            { name: 'The dog', emoji: '🐶', singular: true },
            { name: 'My mom', emoji: '👩', singular: true },
            { name: 'My dad', emoji: '👨', singular: true },
            { name: 'The bird', emoji: '🐦', singular: true },
            { name: 'I', emoji: '🙋', singular: false },
            { name: 'You', emoji: '🫵', singular: false },
            { name: 'We', emoji: '👨‍👩‍👧', singular: false },
            { name: 'They', emoji: '👫', singular: false },
            { name: 'The kids', emoji: '👧👦', singular: false },
            { name: 'My friends', emoji: '🧑‍🤝‍🧑', singular: false }
        ];

        const actions = [
            { base: 'eat', third: 'eats', object: 'chocolate', emoji: '🍫' },
            { base: 'drink', third: 'drinks', object: 'milk', emoji: '🥛' },
            { base: 'like', third: 'likes', object: 'pizza', emoji: '🍕' },
            { base: 'play', third: 'plays', object: 'soccer', emoji: '⚽' },
            { base: 'read', third: 'reads', object: 'books', emoji: '📚' },
            { base: 'watch', third: 'watches', object: 'TV', emoji: '📺' },
            { base: 'sleep', third: 'sleeps', object: 'early', emoji: '😴' },
            { base: 'run', third: 'runs', object: 'fast', emoji: '🏃' },
            { base: 'swim', third: 'swims', object: 'well', emoji: '🏊' },
            { base: 'sing', third: 'sings', object: 'songs', emoji: '🎤' },
            { base: 'dance', third: 'dances', object: 'happily', emoji: '💃' },
            { base: 'cook', third: 'cooks', object: 'dinner', emoji: '🍳' },
            { base: 'draw', third: 'draws', object: 'pictures', emoji: '🎨' },
            { base: 'speak', third: 'speaks', object: 'English', emoji: '🗣️' },
            { base: 'write', third: 'writes', object: 'stories', emoji: '✍️' }
        ];

        const game = createGameState();
        let currentSubject = null;
        let currentAction = null;
        let isNegative = false;
        let correctAnswer = null;

        function displayRound() {
            game.clearTimer();

            const combo = getRandomItem(
                subjects.flatMap(s => actions.map(a => ({
                    subject: s,
                    action: a,
                    negative: Math.random() < 0.5
                }))),
                game.usedItems,
                c => `${c.subject.name}-${c.action.base}-${c.negative ? 'n' : 'p'}`
            );

            currentSubject = combo.subject;
            currentAction = combo.action;
            isNegative = combo.negative;

            // For this game, we determine if they need "don't" or "doesn't"
            // Singular subjects (he, she, it) use "doesn't"
            // Plural/I/you/we/they use "don't"
            correctAnswer = currentSubject.singular ? "doesn't" : "don't";

            document.getElementById('subject-emoji').textContent = currentSubject.emoji;
            document.getElementById('subject').textContent = currentSubject.name;
            document.getElementById('verb').textContent = currentAction.base;
            document.getElementById('object').textContent = currentAction.object;
            document.getElementById('object-emoji').textContent = currentAction.emoji;

            const container = document.getElementById('answer-options');
            container.innerHTML = `
                <button class="answer-pill" onclick="makeGuess('don\\'t')">don't</button>
                <button class="answer-pill" onclick="makeGuess('doesn\\'t')">doesn't</button>
            `;

            resetRoundState(null);
        }

        function makeGuess(selected) {
            const pills = document.querySelectorAll('.answer-pill');
            const isCorrect = selected === correctAnswer;

            pills.forEach(pill => pill.classList.add('disabled'));

            // Build the complete sentence for feedback
            const verb = currentSubject.singular ? currentAction.base : currentAction.base;
            const sentenceExample = `<span style="font-weight: 600;">${currentSubject.name} ${correctAnswer} ${currentAction.base} ${currentAction.object}.</span>`;

            pills.forEach(pill => {
                const pillAnswer = pill.textContent;
                if (pillAnswer === selected) {
                    pill.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
                if (!isCorrect && pillAnswer === correctAnswer) {
                    pill.classList.add('correct');
                }
            });

            // Update the blank with the correct answer
            document.getElementById('blank').textContent = correctAnswer;
            document.getElementById('blank').classList.add('filled');

            showFeedback(isCorrect, sentenceExample);
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            document.getElementById('blank').textContent = '______';
            document.getElementById('blank').classList.remove('filled');
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
