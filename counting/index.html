<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count & Learn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="counting.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="🔢 Count & Learn 🔢"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>How many can you count?</h1>
                <p class="subtitle">Count the items and learn number words!</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card count-card" id="count-card">
                        <div class="count-display" id="count-display">🍎🍎🍎</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <!-- Answer pills will be dynamically inserted here -->
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        const items = [
            { emoji: '🍎', name: 'apples' },
            { emoji: '⭐', name: 'stars' },
            { emoji: '🎈', name: 'balloons' },
            { emoji: '🌸', name: 'flowers' },
            { emoji: '🍪', name: 'cookies' },
            { emoji: '❤️', name: 'hearts' },
            { emoji: '🐝', name: 'bees' },
            { emoji: '🦋', name: 'butterflies' },
            { emoji: '🌼', name: 'daisies' },
            { emoji: '🍓', name: 'strawberries' },
            { emoji: '🎁', name: 'gifts' },
            { emoji: '🌟', name: 'stars' },
            { emoji: '🐠', name: 'fish' },
            { emoji: '🍋', name: 'lemons' },
            { emoji: '🎨', name: 'paint sets' }
        ];

        const numberWords = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
        const game = createGameState();
        let currentItem = null;
        let currentCount = 0;

        function getWrongNumbers(correctNum) {
            const wrong = [];
            while (wrong.length < 2) {
                const num = Math.floor(Math.random() * 11);
                if (num !== correctNum && !wrong.includes(num)) {
                    wrong.push(num);
                }
            }
            return wrong;
        }

        function displayRound() {
            game.clearTimer();
            currentItem = items[Math.floor(Math.random() * items.length)];
            currentCount = Math.floor(Math.random() * 10) + 1;

            document.getElementById('count-display').textContent = currentItem.emoji.repeat(currentCount);

            const wrongNums = getWrongNumbers(currentCount);
            const options = shuffleArray([numberWords[currentCount], ...wrongNums.map(n => numberWords[n])]);

            createAnswerPills(options, o => o.charAt(0).toUpperCase() + o.slice(1), o => o, makeGuess);
            resetRoundState('count-card');
        }

        function makeGuess(selectedWord) {
            const correctAnswer = numberWords[currentCount];
            const isCorrect = selectedWord === correctAnswer;
            const details = `${currentCount} ${currentItem.name} = "${correctAnswer}"`;

            markAnswerPills(selectedWord, correctAnswer);
            showFeedback(isCorrect, details, 'count-card');
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
