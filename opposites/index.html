<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opposite Words</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="opposites.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="🔄 Opposite Words 🔄"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>Find the Opposite!</h1>
                <p class="subtitle">Learn antonyms in English</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card word-card" id="word-card">
                        <div class="word-emoji" id="word-emoji">😊</div>
                        <div class="word-text" id="word-text">Happy</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <!-- Answer pills will be dynamically inserted here -->
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>

    </div>

    <script src="../shared/components.js"></script>
    <script>
        const wordPairs = [
            { word: 'Happy', emoji: '😊', opposite: 'Sad', decoys: ['Angry', 'Excited'] },
            { word: 'Big', emoji: '🐘', opposite: 'Small', decoys: ['Tall', 'Wide'] },
            { word: 'Hot', emoji: '🔥', opposite: 'Cold', decoys: ['Warm', 'Cool'] },
            { word: 'Fast', emoji: '🚀', opposite: 'Slow', decoys: ['Quick', 'Speedy'] },
            { word: 'Clean', emoji: '✨', opposite: 'Dirty', decoys: ['Neat', 'Tidy'] },
            { word: 'Good', emoji: '👍', opposite: 'Bad', decoys: ['Great', 'Nice'] },
            { word: 'Loud', emoji: '📢', opposite: 'Quiet', decoys: ['Noisy', 'Soft'] },
            { word: 'Old', emoji: '👴', opposite: 'Young', decoys: ['Ancient', 'New'] },
            { word: 'Full', emoji: '🍺', opposite: 'Empty', decoys: ['Filled', 'Complete'] },
            { word: 'Light', emoji: '💡', opposite: 'Dark', decoys: ['Bright', 'Shiny'] },
            { word: 'Up', emoji: '⬆️', opposite: 'Down', decoys: ['High', 'Top'] },
            { word: 'Open', emoji: '🚪', opposite: 'Closed', decoys: ['Wide', 'Unlocked'] },
            { word: 'Wet', emoji: '💦', opposite: 'Dry', decoys: ['Damp', 'Soaked'] },
            { word: 'Strong', emoji: '💪', opposite: 'Weak', decoys: ['Powerful', 'Tough'] },
            { word: 'Day', emoji: '☀️', opposite: 'Night', decoys: ['Morning', 'Noon'] }
        ];

        const game = createGameState();
        let currentPair = null;

        function displayRound() {
            game.clearTimer();
            currentPair = getRandomItem(wordPairs, game.usedItems, p => p.word);

            document.getElementById('word-emoji').textContent = currentPair.emoji;
            document.getElementById('word-text').textContent = currentPair.word;

            const options = shuffleArray([currentPair.opposite, ...currentPair.decoys]);
            createAnswerPills(options, o => o, o => o, makeGuess);
            resetRoundState('word-card');
        }

        function makeGuess(selected) {
            const isCorrect = selected === currentPair.opposite;
            const details = `${currentPair.word} ↔️ ${currentPair.opposite}`;

            markAnswerPills(selected, currentPair.opposite);
            showFeedback(isCorrect, details, 'word-card');
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
