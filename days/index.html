<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days of the Week</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="days.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="📅 Days of the Week 📅"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>Learn the Days!</h1>
                <p class="subtitle">Practice days of the week in English</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card day-card" id="day-card">
                        <div class="day-emoji" id="day-emoji">📅</div>
                        <div class="question-text" id="question-text">What comes after Monday?</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <!-- Answer pills will be dynamically inserted here -->
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>

    </div>

    <script src="../shared/components.js"></script>
    <script>
        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const dayEmojis = { Monday: '💼', Tuesday: '📝', Wednesday: '🐫', Thursday: '⚡', Friday: '🎉', Saturday: '🏖️', Sunday: '😴' };
        const positions = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh'];

        const game = createGameState();
        let currentQuestion = null;

        function generateQuestion() {
            const types = ['after', 'before', 'order'];
            const type = types[Math.floor(Math.random() * types.length)];

            if (type === 'after') {
                const idx = Math.floor(Math.random() * 6);
                return { text: `What comes AFTER ${daysOfWeek[idx]}?`, answer: daysOfWeek[idx + 1] };
            } else if (type === 'before') {
                const idx = Math.floor(Math.random() * 6) + 1;
                return { text: `What comes BEFORE ${daysOfWeek[idx]}?`, answer: daysOfWeek[idx - 1] };
            } else {
                const idx = Math.floor(Math.random() * 7);
                return { text: `Which day is ${positions[idx]}?`, answer: daysOfWeek[idx] };
            }
        }

        function displayRound() {
            game.clearTimer();
            currentQuestion = generateQuestion();

            document.getElementById('day-emoji').textContent = '📅';
            document.getElementById('question-text').textContent = currentQuestion.text;

            const wrong = getWrongAnswers(daysOfWeek, currentQuestion.answer, d => d, 2);
            const options = shuffleArray([currentQuestion.answer, ...wrong]);
            createAnswerPills(options, o => o, o => o, makeGuess);
            resetRoundState('day-card');
        }

        function makeGuess(selected) {
            const isCorrect = selected === currentQuestion.answer;
            document.getElementById('day-emoji').textContent = dayEmojis[currentQuestion.answer];

            const weekOrder = daysOfWeek.join(' → ');
            markAnswerPills(selected, currentQuestion.answer);
            showFeedback(isCorrect, `<span style="font-size: 0.9em;">${weekOrder}</span>`, 'day-card');
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
