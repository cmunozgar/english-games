<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Does Food Give You?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="nutrients.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container with Logo + Card -->
    <div class="main-container">
        <!-- Logo -->
        <div class="logo-container">
            <h1 class="game-logo">💪 What Does Food Give You? 🍽️</h1>
        </div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>What nutrient is in this food?</h1>
                <p class="subtitle">Learn about proteins, carbs, fats, and vitamins!</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card food-card" id="food-card">
                        <div class="food-emoji" id="food-emoji">🥩</div>
                        <div class="food-name" id="food-name">Steak</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <button class="answer-pill" data-nutrient="protein" onclick="makeGuess('protein')">
                            💪 Protein
                        </button>
                        <button class="answer-pill" data-nutrient="carbs" onclick="makeGuess('carbs')">
                            ⚡ Carbs
                        </button>
                        <button class="answer-pill" data-nutrient="fats" onclick="makeGuess('fats')">
                            🧈 Fats
                        </button>
                        <button class="answer-pill" data-nutrient="vitamins" onclick="makeGuess('vitamins')">
                            🍊 Vitamins
                        </button>
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← Back to Menu</a>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        // Food items categorized by main nutrient
        const foodItems = [
            // Protein foods
            { emoji: '🥩', name: 'Steak', nutrient: 'protein', info: 'Steak is full of protein to build strong muscles!' },
            { emoji: '🍗', name: 'Chicken', nutrient: 'protein', info: 'Chicken gives you protein for energy and strength!' },
            { emoji: '🐟', name: 'Fish', nutrient: 'protein', info: 'Fish has protein and is great for your brain!' },
            { emoji: '🥚', name: 'Egg', nutrient: 'protein', info: 'Eggs are packed with protein to help you grow!' },
            { emoji: '🦐', name: 'Shrimp', nutrient: 'protein', info: 'Shrimp has lots of protein and very little fat!' },
            { emoji: '🥓', name: 'Bacon', nutrient: 'protein', info: 'Bacon has protein from pork meat!' },
            { emoji: '🍖', name: 'Meat', nutrient: 'protein', info: 'Meat is one of the best sources of protein!' },
            { emoji: '🦃', name: 'Turkey', nutrient: 'protein', info: 'Turkey is a lean protein that builds muscles!' },
            { emoji: '🫘', name: 'Beans', nutrient: 'protein', info: 'Beans have plant protein and are very healthy!' },
            { emoji: '🧀', name: 'Cheese', nutrient: 'protein', info: 'Cheese has protein from milk!' },
            { emoji: '🥛', name: 'Milk', nutrient: 'protein', info: 'Milk has protein to build strong bones and muscles!' },
            { emoji: '🍤', name: 'Prawns', nutrient: 'protein', info: 'Prawns are full of protein from the sea!' },

            // Carbohydrate foods
            { emoji: '🍞', name: 'Bread', nutrient: 'carbs', info: 'Bread has carbs that give you energy to play!' },
            { emoji: '🍝', name: 'Pasta', nutrient: 'carbs', info: 'Pasta is full of carbs for lots of energy!' },
            { emoji: '🍚', name: 'Rice', nutrient: 'carbs', info: 'Rice has carbs that fuel your body!' },
            { emoji: '🥔', name: 'Potato', nutrient: 'carbs', info: 'Potatoes have carbs to give you energy!' },
            { emoji: '🌽', name: 'Corn', nutrient: 'carbs', info: 'Corn has carbs and is a healthy vegetable!' },
            { emoji: '🥐', name: 'Croissant', nutrient: 'carbs', info: 'Croissants have carbs from flour!' },
            { emoji: '🥣', name: 'Cereal', nutrient: 'carbs', info: 'Cereal has carbs to start your day with energy!' },
            { emoji: '🥞', name: 'Pancakes', nutrient: 'carbs', info: 'Pancakes are made with flour, full of carbs!' },
            { emoji: '🍕', name: 'Pizza', nutrient: 'carbs', info: 'Pizza dough is made of carbs!' },
            { emoji: '🥯', name: 'Bagel', nutrient: 'carbs', info: 'Bagels have carbs from wheat flour!' },
            { emoji: '🍪', name: 'Cookie', nutrient: 'carbs', info: 'Cookies have carbs from flour and sugar!' },
            { emoji: '🍰', name: 'Cake', nutrient: 'carbs', info: 'Cake is full of carbs from flour and sugar!' },
            { emoji: '🍩', name: 'Donut', nutrient: 'carbs', info: 'Donuts have lots of carbs from flour and sugar!' },
            { emoji: '🍬', name: 'Candy', nutrient: 'carbs', info: 'Candy is pure sugar, which is a carb!' },
            { emoji: '🍯', name: 'Honey', nutrient: 'carbs', info: 'Honey is natural sugar, which is a carb!' },

            // Fat foods
            { emoji: '🧈', name: 'Butter', nutrient: 'fats', info: 'Butter is made of fat from milk!' },
            { emoji: '🥑', name: 'Avocado', nutrient: 'fats', info: 'Avocados have healthy fats for your brain!' },
            { emoji: '🫒', name: 'Olives', nutrient: 'fats', info: 'Olives have healthy fats called olive oil!' },
            { emoji: '🥥', name: 'Coconut', nutrient: 'fats', info: 'Coconuts are full of natural healthy fats!' },
            { emoji: '🍟', name: 'French Fries', nutrient: 'fats', info: 'French fries are cooked in lots of oil (fat)!' },
            { emoji: '🍦', name: 'Ice Cream', nutrient: 'fats', info: 'Ice cream has fats from cream and milk!' },
            { emoji: '🌰', name: 'Nuts', nutrient: 'fats', info: 'Nuts have healthy fats that are good for you!' },
            { emoji: '🥜', name: 'Peanut Butter', nutrient: 'fats', info: 'Peanut butter has healthy fats from peanuts!' },
            { emoji: '🍫', name: 'Chocolate', nutrient: 'fats', info: 'Chocolate has fats from cocoa butter!' },

            // Vitamin foods
            { emoji: '🍊', name: 'Orange', nutrient: 'vitamins', info: 'Oranges are full of Vitamin C to keep you healthy!' },
            { emoji: '🥕', name: 'Carrot', nutrient: 'vitamins', info: 'Carrots have Vitamin A for healthy eyes!' },
            { emoji: '🍋', name: 'Lemon', nutrient: 'vitamins', info: 'Lemons are packed with Vitamin C!' },
            { emoji: '🍓', name: 'Strawberry', nutrient: 'vitamins', info: 'Strawberries have lots of Vitamin C!' },
            { emoji: '🥦', name: 'Broccoli', nutrient: 'vitamins', info: 'Broccoli has Vitamins C and K for strong bones!' },
            { emoji: '🍌', name: 'Banana', nutrient: 'vitamins', info: 'Bananas have Vitamin B6 for energy!' },
            { emoji: '🍎', name: 'Apple', nutrient: 'vitamins', info: 'Apples have Vitamin C and fiber!' },
            { emoji: '🥬', name: 'Spinach', nutrient: 'vitamins', info: 'Spinach is loaded with Vitamins A and K!' },
            { emoji: '🍇', name: 'Grapes', nutrient: 'vitamins', info: 'Grapes have Vitamins C and K!' },
            { emoji: '🫐', name: 'Blueberries', nutrient: 'vitamins', info: 'Blueberries are full of Vitamin C and antioxidants!' },
            { emoji: '🍅', name: 'Tomato', nutrient: 'vitamins', info: 'Tomatoes have Vitamins A and C!' },
            { emoji: '🥝', name: 'Kiwi', nutrient: 'vitamins', info: 'Kiwis have more Vitamin C than oranges!' },
            { emoji: '🍑', name: 'Peach', nutrient: 'vitamins', info: 'Peaches have Vitamins A and C!' },
            { emoji: '🥭', name: 'Mango', nutrient: 'vitamins', info: 'Mangos are rich in Vitamins A and C!' },
            { emoji: '🍉', name: 'Watermelon', nutrient: 'vitamins', info: 'Watermelon has Vitamins A and C!' }
        ];

        let currentFood = null;
        let streak = 0;
        let maxStreak = 0;
        let usedFoods = new Set();
        let autoAdvanceTimer = null;

        // Fun messages for different outcomes
        const correctMessages = [
            "⭐ Amazing! You're right!",
            "🎉 Perfect! Great job!",
            "👏 Excellent work!",
            "🌟 You got it!",
            "💚 Fantastic!",
            "🎊 Super smart!",
            "✨ Well done!",
            "🏆 You're a nutrition expert!",
            "💪 Great choice!",
            "🎯 Spot on!"
        ];

        const incorrectMessages = [
            "💭 Oops! Let's learn:",
            "🤔 Not quite! Here's why:",
            "📚 Let's discover:",
            "💡 Good try! Now you know:",
            "🌱 That's okay! Learn this:",
            "🎓 Nice effort! Remember:",
            "🔍 Almost! Here's the truth:",
            "📖 Don't worry! Now you know:",
            "🧠 Learning time:",
            "💫 Great guess! Actually:"
        ];

        function getRandomMessage(messages) {
            const randomIndex = Math.floor(Math.random() * messages.length);
            return messages[randomIndex];
        }

        function getRandomFood() {
            if (foodItems.length === 0) {
                console.error("No food items available");
                return null;
            }

            let attempts = 0;
            const maxAttempts = 100;

            while (attempts < maxAttempts) {
                const randomIndex = Math.floor(Math.random() * foodItems.length);
                const food = foodItems[randomIndex];

                if (!usedFoods.has(food.name)) {
                    usedFoods.add(food.name);
                    return food;
                }
                attempts++;
            }

            // If we've seen all foods, reset and return a new food
            usedFoods.clear();
            const randomIndex = Math.floor(Math.random() * foodItems.length);
            return foodItems[randomIndex];
        }

        function displayRound() {
            // Clear any existing auto-advance timer
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }

            currentFood = getRandomFood();

            // Display food
            document.getElementById('food-emoji').textContent = currentFood.emoji;
            document.getElementById('food-name').textContent = currentFood.name;

            // Reset states
            document.getElementById('food-card').classList.remove('correct', 'incorrect', 'disabled', 'fade-out', 'fade-in');
            const pills = document.querySelectorAll('.answer-pill');
            pills.forEach(pill => {
                pill.classList.remove('disabled', 'correct', 'incorrect');
            });
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('show', 'correct', 'incorrect');
            const nextButton = document.getElementById('next-button');
            nextButton.classList.remove('show', 'auto-advance');
        }

        function makeGuess(selectedNutrient) {
            const pills = document.querySelectorAll('.answer-pill');
            const feedback = document.getElementById('feedback');
            const nextButton = document.getElementById('next-button');
            const foodCard = document.getElementById('food-card');

            // Disable all pills
            pills.forEach(pill => pill.classList.add('disabled'));

            const isCorrect = selectedNutrient === currentFood.nutrient;

            if (isCorrect) {
                streak++;
                if (streak > maxStreak) {
                    maxStreak = streak;
                }

                // Combine message and info
                feedback.innerHTML = `
                    <div>${getRandomMessage(correctMessages)}</div>
                    <div style="margin-top: 0.5rem;">${currentFood.info}</div>
                `;
                feedback.classList.add('show', 'correct');
                foodCard.classList.add('correct');

                // Highlight correct pill
                pills.forEach(pill => {
                    if (pill.dataset.nutrient === selectedNutrient) {
                        pill.classList.add('correct');
                    }
                });
            } else {
                streak = 0;

                // Combine message and info
                feedback.innerHTML = `
                    <div>${getRandomMessage(incorrectMessages)}</div>
                    <div style="margin-top: 0.5rem;">${currentFood.info}</div>
                `;
                feedback.classList.add('show', 'incorrect');
                foodCard.classList.add('incorrect');

                // Highlight correct and incorrect pills
                pills.forEach(pill => {
                    if (pill.dataset.nutrient === selectedNutrient) {
                        pill.classList.add('incorrect');
                    }
                    if (pill.dataset.nutrient === currentFood.nutrient) {
                        pill.classList.add('correct');
                    }
                });
            }

            // Update score display
            document.getElementById('streak').textContent = streak;
            document.getElementById('max-streak').textContent = maxStreak;

            // Show next button with auto-advance
            nextButton.classList.add('show');

            // Start auto-advance timer and animation
            setTimeout(() => {
                nextButton.classList.add('auto-advance');
            }, 10);

            autoAdvanceTimer = setTimeout(() => {
                nextRound();
            }, 3500);
        }

        function nextRound() {
            // Fade out current content
            const guessLayout = document.querySelector('.guess-layout');
            const feedback = document.getElementById('feedback');
            const nextButton = document.getElementById('next-button');

            guessLayout.classList.add('fade-out');
            feedback.classList.add('fade-out');
            nextButton.classList.add('fade-out');

            // Wait for fade out animation, then load new round
            setTimeout(() => {
                // Remove fade-out classes
                feedback.classList.remove('fade-out');
                nextButton.classList.remove('fade-out');

                displayRound();

                // Fade in new content
                setTimeout(() => {
                    guessLayout.classList.remove('fade-out');
                    guessLayout.classList.add('fade-in');

                    // Remove animation class after animation completes
                    setTimeout(() => {
                        guessLayout.classList.remove('fade-in');
                    }, 400);
                }, 50);
            }, 300);
        }

        // Initialize game
        displayRound();
    </script>
</body>
</html>
