<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Words</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="☀️ Weather Words ☁️"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>What's the Weather?</h1>
                <p class="subtitle">Learn weather words in English!</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card weather-card" id="weather-card">
                        <div class="weather-emoji" id="weather-emoji">☀️</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <!-- Answer pills will be dynamically inserted here -->
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        const weatherTypes = [
            { word: 'sunny', emoji: '☀️', description: 'The sun is shining brightly!' },
            { word: 'rainy', emoji: '🌧️', description: 'It\'s raining! Bring an umbrella!' },
            { word: 'cloudy', emoji: '☁️', description: 'The sky is full of clouds!' },
            { word: 'snowy', emoji: '❄️', description: 'It\'s snowing! Time to play!' },
            { word: 'windy', emoji: '💨', description: 'The wind is blowing strong!' },
            { word: 'stormy', emoji: '⛈️', description: 'There\'s a storm with thunder!' },
            { word: 'foggy', emoji: '🌫️', description: 'It\'s hard to see in the fog!' },
            { word: 'hot', emoji: '🔥', description: 'The weather is very hot!' },
            { word: 'cold', emoji: '🥶', description: 'Brrr! It\'s very cold!' },
            { word: 'rainbow', emoji: '🌈', description: 'A beautiful rainbow appears!' }
        ];

        const game = createGameState();
        let currentWeather = null;

        function displayRound() {
            game.clearTimer();
            currentWeather = getRandomItem(weatherTypes, game.usedItems, w => w.word);

            document.getElementById('weather-emoji').textContent = currentWeather.emoji;

            const wrongAnswers = getWrongAnswers(weatherTypes, currentWeather, w => w.word);
            const options = shuffleArray([currentWeather, ...wrongAnswers]);

            createAnswerPills(
                options,
                w => w.word.charAt(0).toUpperCase() + w.word.slice(1),
                w => w.word,
                makeGuess
            );

            resetRoundState('weather-card');
        }

        function makeGuess(selected) {
            const isCorrect = selected.word === currentWeather.word;
            const details = `${currentWeather.emoji} = ${currentWeather.word}<div style="margin-top: 0.25rem; font-size: 0.9em;">${currentWeather.description}</div>`;

            markAnswerPills(selected.word, currentWeather.word);
            showFeedback(isCorrect, details, 'weather-card');
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
