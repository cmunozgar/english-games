<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>His or Her?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="hisher.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="👦 His or Her? 👧"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>His or Her?</h1>
                <p class="subtitle">Learn when to use "his" and "her"!</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="scene-container">
                        <div class="sentence-card">
                            <div class="subject-emoji" id="subject-emoji">👦</div>
                            <div class="sentence-text">
                                <span class="blank" id="blank">______</span>
                                <span class="object" id="object">ball</span>
                                <span class="object-emoji" id="object-emoji">⚽</span>
                            </div>
                        </div>

                        <div class="answer-options" id="answer-options">
                            <button class="answer-pill" onclick="makeGuess('His')">His</button>
                            <button class="answer-pill" onclick="makeGuess('Her')">Her</button>
                        </div>
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        const people = [
            { name: 'Tom', emoji: '👦', pronoun: 'His' },
            { name: 'Jack', emoji: '👦', pronoun: 'His' },
            { name: 'Dad', emoji: '👨', pronoun: 'His' },
            { name: 'Grandpa', emoji: '👴', pronoun: 'His' },
            { name: 'The boy', emoji: '👦', pronoun: 'His' },
            { name: 'The man', emoji: '👨', pronoun: 'His' },
            { name: 'The king', emoji: '🤴', pronoun: 'His' },
            { name: 'The prince', emoji: '🤴', pronoun: 'His' },
            { name: 'Lucy', emoji: '👧', pronoun: 'Her' },
            { name: 'Emma', emoji: '👧', pronoun: 'Her' },
            { name: 'Mom', emoji: '👩', pronoun: 'Her' },
            { name: 'Grandma', emoji: '👵', pronoun: 'Her' },
            { name: 'The girl', emoji: '👧', pronoun: 'Her' },
            { name: 'The woman', emoji: '👩', pronoun: 'Her' },
            { name: 'The queen', emoji: '👸', pronoun: 'Her' },
            { name: 'The princess', emoji: '👸', pronoun: 'Her' }
        ];

        const objects = [
            { name: 'ball', emoji: '⚽' },
            { name: 'book', emoji: '📖' },
            { name: 'dog', emoji: '🐶' },
            { name: 'cat', emoji: '🐱' },
            { name: 'hat', emoji: '🎩' },
            { name: 'bag', emoji: '🎒' },
            { name: 'phone', emoji: '📱' },
            { name: 'bike', emoji: '🚲' },
            { name: 'pencil', emoji: '✏️' },
            { name: 'toy', emoji: '🧸' },
            { name: 'shoes', emoji: '👟' },
            { name: 'lunch', emoji: '🍱' },
            { name: 'homework', emoji: '📝' },
            { name: 'jacket', emoji: '🧥' },
            { name: 'guitar', emoji: '🎸' }
        ];

        const game = createGameState();
        let currentPerson = null;
        let currentObject = null;

        function displayRound() {
            game.clearTimer();

            const combo = getRandomItem(
                people.flatMap(p => objects.map(o => ({ person: p, object: o }))),
                game.usedItems,
                c => `${c.person.name}-${c.object.name}`
            );

            currentPerson = combo.person;
            currentObject = combo.object;

            document.getElementById('subject-emoji').textContent = currentPerson.emoji;
            document.getElementById('object').textContent = currentObject.name;
            document.getElementById('object-emoji').textContent = currentObject.emoji;

            const container = document.getElementById('answer-options');
            container.innerHTML = `
                <button class="answer-pill" onclick="makeGuess('His')">His</button>
                <button class="answer-pill" onclick="makeGuess('Her')">Her</button>
            `;

            resetRoundState(null);
        }

        function makeGuess(selected) {
            const pills = document.querySelectorAll('.answer-pill');
            const isCorrect = selected === currentPerson.pronoun;

            pills.forEach(pill => pill.classList.add('disabled'));

            const sentenceExample = `<span style="font-weight: 600;">${currentPerson.name} has a ${currentObject.name}. It is ${currentPerson.pronoun.toLowerCase()} ${currentObject.name}.</span>`;

            pills.forEach(pill => {
                const pillAnswer = pill.textContent.trim();
                if (pillAnswer === selected) {
                    pill.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
                if (!isCorrect && pillAnswer === currentPerson.pronoun) {
                    pill.classList.add('correct');
                }
            });

            document.getElementById('blank').textContent = currentPerson.pronoun;
            document.getElementById('blank').classList.add('filled');

            showFeedback(isCorrect, sentenceExample);
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            document.getElementById('blank').textContent = '______';
            document.getElementById('blank').classList.remove('filled');
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
