<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processed or Natural?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="origins.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation" id="background-animation"></div>

    <!-- Main Container with Logo + Card -->
    <div class="main-container">
        <!-- Header with back link and logo -->
        <div class="top-header" id="top-header" data-title="🏭 Processed or Natural? 🌿"></div>

        <!-- Game Card -->
        <div class="game-container">
            <div class="header">
                <h1>Is this food processed?</h1>
                <p class="subtitle">Learn about natural and processed foods!</p>
            </div>

            <div id="score-container"></div>

            <div id="game-play">
                <div class="guess-layout">
                    <div class="single-card food-card" id="food-card">
                        <div class="food-emoji" id="food-emoji">🍎</div>
                        <div class="food-name" id="food-name">Apple</div>
                    </div>

                    <div class="answer-options" id="answer-options">
                        <button class="answer-pill natural" onclick="makeGuess(false)">
                            🌿 Natural
                        </button>
                        <button class="answer-pill processed" onclick="makeGuess(true)">
                            🏭 Processed
                        </button>
                    </div>
                </div>

                <div class="feedback">
                    <div class="feedback-message" id="feedback"></div>
                </div>

                <button class="next-button" id="next-button" onclick="nextRound()"><span>Next Round →</span></button>
            </div>
        </div>
    </div>

    <script src="../shared/components.js"></script>
    <script>
        const foodItems = [
            // Natural foods (not processed)
            { emoji: '🍎', name: 'Apple', processed: false, info: 'Apples grow on trees and are eaten fresh!' },
            { emoji: '🍌', name: 'Banana', processed: false, info: 'Bananas are picked from banana plants and eaten fresh!' },
            { emoji: '🥕', name: 'Carrot', processed: false, info: 'Carrots are vegetables pulled straight from the ground!' },
            { emoji: '🍅', name: 'Tomato', processed: false, info: 'Tomatoes grow on vines and can be eaten right away!' },
            { emoji: '🥬', name: 'Lettuce', processed: false, info: 'Lettuce is a leafy green picked fresh from the garden!' },
            { emoji: '🍇', name: 'Grapes', processed: false, info: 'Grapes grow on vines and are eaten fresh!' },
            { emoji: '🍊', name: 'Orange', processed: false, info: 'Oranges grow on trees and are eaten fresh!' },
            { emoji: '🥒', name: 'Cucumber', processed: false, info: 'Cucumbers are vegetables eaten fresh from the plant!' },
            { emoji: '🍓', name: 'Strawberry', processed: false, info: 'Strawberries are picked and eaten fresh!' },
            { emoji: '🥦', name: 'Broccoli', processed: false, info: 'Broccoli is a vegetable eaten fresh or lightly cooked!' },
            { emoji: '🍑', name: 'Peach', processed: false, info: 'Peaches grow on trees and are eaten fresh!' },
            { emoji: '🌽', name: 'Corn on the Cob', processed: false, info: 'Corn on the cob is eaten right off the stalk!' },
            { emoji: '🥚', name: 'Egg', processed: false, info: 'Eggs come directly from chickens!' },
            { emoji: '🥛', name: 'Milk', processed: false, info: 'Milk comes directly from cows!' },
            { emoji: '🍯', name: 'Honey', processed: false, info: 'Honey is made by bees and collected naturally!' },
            { emoji: '🥜', name: 'Peanuts', processed: false, info: 'Peanuts are harvested and can be eaten raw or roasted!' },
            { emoji: '🐟', name: 'Fresh Fish', processed: false, info: 'Fresh fish is caught and eaten without processing!' },
            { emoji: '🍗', name: 'Chicken', processed: false, info: 'Fresh chicken meat comes directly from the animal!' },
            { emoji: '🥩', name: 'Fresh Steak', processed: false, info: 'Fresh steak is cut directly from the cow!' },
            // Processed foods
            { emoji: '🍕', name: 'Pizza', processed: true, info: 'Pizza is made in factories with many processed ingredients!' },
            { emoji: '🍔', name: 'Hamburger', processed: true, info: 'Hamburgers have processed buns, patties, and sauces!' },
            { emoji: '🍟', name: 'French Fries', processed: true, info: 'French fries are cut, frozen, and fried in factories!' },
            { emoji: '🌭', name: 'Hot Dog', processed: true, info: 'Hot dogs are made from processed meat mixtures!' },
            { emoji: '🍩', name: 'Donut', processed: true, info: 'Donuts are made with processed flour, sugar, and oils!' },
            { emoji: '🍪', name: 'Cookie', processed: true, info: 'Cookies are baked with processed ingredients!' },
            { emoji: '🍰', name: 'Cake', processed: true, info: 'Cake is made with processed flour, sugar, and more!' },
            { emoji: '🍫', name: 'Chocolate Bar', processed: true, info: 'Chocolate bars go through many factory steps!' },
            { emoji: '🍬', name: 'Candy', processed: true, info: 'Candy is made in factories with lots of sugar!' },
            { emoji: '🥤', name: 'Soda', processed: true, info: 'Soda is made in factories with sugar and chemicals!' },
            { emoji: '🍦', name: 'Ice Cream', processed: true, info: 'Ice cream is processed with sugar, cream, and additives!' },
            { emoji: '🧁', name: 'Cupcake', processed: true, info: 'Cupcakes are baked with processed ingredients!' },
            { emoji: '🥐', name: 'Croissant', processed: true, info: 'Croissants are made with processed flour and butter!' },
            { emoji: '🍞', name: 'Bread', processed: true, info: 'Bread is made by processing wheat into flour and baking it!' },
            { emoji: '🧀', name: 'Cheese', processed: true, info: 'Cheese is made by processing milk with enzymes!' },
            { emoji: '🥓', name: 'Bacon', processed: true, info: 'Bacon is cured and smoked in a factory!' },
            { emoji: '🍝', name: 'Pasta', processed: true, info: 'Pasta is made by processing wheat into shapes!' },
            { emoji: '🥣', name: 'Cereal', processed: true, info: 'Cereal is made in factories from processed grains!' },
            { emoji: '🍭', name: 'Lollipop', processed: true, info: 'Lollipops are made in factories from sugar!' },
            { emoji: '🥫', name: 'Canned Food', processed: true, info: 'Canned food is cooked and sealed in factories!' },
            { emoji: '🧃', name: 'Juice Box', processed: true, info: 'Juice boxes contain processed and sweetened juice!' },
            { emoji: '🍿', name: 'Popcorn', processed: true, info: 'Packaged popcorn has added butter, salt, and flavors!' },
            { emoji: '🥨', name: 'Pretzel', processed: true, info: 'Pretzels are made from processed dough and salt!' }
        ];

        const game = createGameState();
        let currentFood = null;

        function displayRound() {
            game.clearTimer();
            currentFood = getRandomItem(foodItems, game.usedItems, f => f.name);

            document.getElementById('food-emoji').textContent = currentFood.emoji;
            document.getElementById('food-name').textContent = currentFood.name;

            resetRoundState('food-card');
            const pills = document.querySelectorAll('.answer-pill');
            pills.forEach(pill => pill.classList.remove('disabled', 'correct', 'incorrect'));
        }

        function makeGuess(selectedProcessed) {
            const pills = document.querySelectorAll('.answer-pill');
            const isCorrect = selectedProcessed === currentFood.processed;

            pills.forEach(pill => pill.classList.add('disabled'));

            const pillsArray = Array.from(pills);
            const selectedIndex = selectedProcessed ? 1 : 0;
            const correctIndex = currentFood.processed ? 1 : 0;

            if (isCorrect) {
                pillsArray[selectedIndex].classList.add('correct');
            } else {
                pillsArray[selectedIndex].classList.add('incorrect');
                pillsArray[correctIndex].classList.add('correct');
            }

            showFeedback(isCorrect, currentFood.info, 'food-card');
            game.updateStreak(isCorrect);
            game.startAutoAdvance(nextRound);
        }

        function nextRound() {
            transitionToNextRound(displayRound);
        }

        displayRound();
    </script>
</body>
</html>
